services:
  solar-sentinel:
    build: .
    container_name: solar-sentinel
    ports:
      - '49877:43187'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=43187
      - SQLITE_DB_PATH=/app/data/solar-sentinel.sqlite
    volumes:
      - solar-sentinel-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:43187/api/weather').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  solar-sentinel-data:
